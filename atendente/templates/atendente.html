<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Atendente - SENAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .bg-senai { background-color: #005ca9; }
        .text-senai { color: #005ca9; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <nav class="bg-senai p-6 text-white shadow-lg mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-black italic">SENAI <span class="font-light not-italic text-xl ml-2 text-blue-100">Controle de Atendimento</span></h1>
            <div id="status-conexao" class="flex items-center gap-2 text-sm bg-white/20 px-4 py-2 rounded-full">
                <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                Sistema Online
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 max-w-6xl grid grid-cols-1 md:grid-cols-12 gap-8">
        
        <!-- Lado Esquerdo: Chamada e Fila -->
        <div class="md:col-span-8">
            <div class="bg-white rounded-[2rem] shadow-2xl p-10 text-center border-t-8 border-[#005ca9] mb-8">
                <div class="mb-8 max-w-xs mx-auto">
                    <label class="block text-gray-400 font-bold uppercase tracking-widest text-[10px] mb-2 text-center">Seu Local de Atendimento</label>
                    <select id="select-guiche" class="w-full p-3 rounded-xl border-2 border-gray-100 font-bold text-senai outline-none bg-gray-50 text-center text-lg">
                        <option value="Guichê 01">Guichê 01</option>
                        <option value="Guichê 02">Guichê 02</option>
                        <option value="Guichê 03">Guichê 03</option>
                        <option value="Mesa A">Mesa A</option>
                    </select>
                </div>

                <h2 class="text-gray-400 font-bold uppercase tracking-widest text-sm mb-4">Em Atendimento Agora</h2>
                <div id="display-atendimento" class="mb-10">
                    <div id="atendente-codigo" class="text-9xl font-black text-gray-800 leading-none mb-4">---</div>
                    <div id="atendente-nome" class="text-3xl font-bold text-senai uppercase italic tracking-tight">Aguardando Chamada</div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <button onclick="chamarProximo()" class="group bg-senai hover:bg-blue-800 text-white p-8 rounded-3xl shadow-xl flex flex-col items-center justify-center gap-3 transition-all active:scale-95">
                        <i data-lucide="user-plus" class="w-12 h-12"></i>
                        <span class="text-xl font-black">CHAMAR PRÓXIMO</span>
                    </button>
                    <button id="btn-repetir" onclick="repetirChamadaAtual()" class="group bg-gray-200 text-gray-400 p-8 rounded-3xl flex flex-col items-center justify-center gap-3 opacity-50 cursor-not-allowed transition-all active:scale-95" disabled>
                        <i data-lucide="refresh-cw" class="w-12 h-12 group-hover:rotate-180 transition-transform duration-700"></i>
                        <span class="text-xl font-black">REPETIR CHAMADA</span>
                    </button>
                </div>
            </div>

            <!-- Fila de Espera -->
            <div class="bg-white rounded-3xl shadow-lg p-8 border-b-4 border-gray-200">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-gray-600 flex items-center gap-3">
                        <i data-lucide="list-ordered" class="text-senai"></i> Fila de Espera
                    </h3>
                    <span id="contador-fila" class="bg-blue-50 text-senai px-4 py-1 rounded-full font-black text-sm uppercase">0 na fila</span>
                </div>
                <div id="lista-espera" class="space-y-4">
                    <!-- O JS injeta a fila aqui -->
                </div>
            </div>
        </div>

        <!-- Lado Direito: Histórico -->
        <div class="md:col-span-4">
            <div class="bg-white rounded-[2.5rem] shadow-xl p-8 border-t-8 border-orange-500 sticky top-8">
                <h3 class="text-xl font-bold text-gray-500 mb-6 flex items-center gap-3 uppercase italic tracking-tighter">
                    <i data-lucide="history" class="text-orange-500"></i> Histórico Recente
                </h3>
                <div id="history-list-atendente" class="space-y-4">
                    <!-- O JS injeta o histórico aqui -->
                </div>
            </div>
        </div>

    </main>

    <script src="/static/js/atendente.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
