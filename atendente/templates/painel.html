<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI - Painel de Chamadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Garante que o texto da senha não quebre o layout se for muito grande */
        #current-ticket {
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden flex flex-col p-6">
    
    <div class="flex justify-between items-center mb-6 bg-white p-6 rounded-3xl shadow-sm">
        <h1 class="text-4xl font-black text-[#005DA5]">SENAI <span class="font-light text-gray-400 text-2xl">GAMA</span></h1>
        <div class="text-right">
            <div id="clock" class="text-5xl font-black text-gray-800">00:00:00</div>
            <div id="date" class="text-gray-500 font-bold uppercase tracking-widest text-sm">Carregando...</div>
        </div>
    </div>

    <div class="flex flex-1 gap-6">
        <div class="flex-[2] bg-[#005DA5] rounded-[40px] shadow-2xl flex flex-col items-center justify-center text-white relative border-[12px] border-white">
            <h2 class="text-3xl font-bold uppercase tracking-[0.2em] opacity-80 mb-4">Senha Atual</h2>
            
            <div id="current-ticket" class="text-[15rem] font-black mb-4 text-center w-full">---</div>
            
            <div class="bg-white/20 px-12 py-4 rounded-full backdrop-blur-md mb-8">
                <span id="current-name" class="text-4xl font-bold uppercase text-center">Aguardando Chamada</span>
            </div>

            <div class="bg-red-600 px-16 py-6 rounded-3xl shadow-xl">
                <span class="block text-center text-sm font-black uppercase opacity-80">Dirija-se ao</span>
                <span id="current-guiche" class="text-5xl font-black uppercase tracking-tighter text-center">--</span>
            </div>
        </div>

        <div class="flex-1 bg-white rounded-[40px] shadow-sm p-8 flex flex-col overflow-hidden">
            <h2 class="text-xl font-black text-gray-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                <i data-lucide="history"></i> Últimas Chamadas
            </h2>
            <div id="history-list" class="flex-1 space-y-4 overflow-y-auto pr-2">
                <div class="text-gray-300 text-center italic mt-10 text-sm">Nenhuma senha no histórico</div>
            </div>
        </div>
    </div>

    <audio id="audioChamada">
        <source src="/static/audio/chamada.mp3" type="audio/mpeg">
    </audio>

    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 text-gray-400 text-[10px] font-bold uppercase tracking-[0.3em] bg-white
