<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SENAI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-[#005DA5] p-6 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black italic">SENAI Dashboard</h1>
            <div class="flex gap-4">
                <button onclick="solicitarResetFila()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl font-bold text-sm transition-all shadow-md">
                    🗑️ Resetar Fila
                </button>
                <a href="/atendente" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl text-sm font-bold">Sair</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-8">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-4xl font-black text-gray-800 uppercase italic">Métricas por Público</h2>
            <button onclick="carregarDados()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-black shadow-lg">
                🔄 ATUALIZAR DADOS
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="card-base card-normal">
                <p class="label-card">Normal</p>
                <h3 id="card-norm" class="valor-preto">0</h3>
            </div>
            
            <div class="card-base card-preferencial">
                <p class="label-card" style="color: white !important;">Preferencial</p>
                <h3 id="card-pref" class="valor-preto">0</h3>
            </div>

            <div class="card-base card-financeiro">
                <p class="label-card" style="color: white !important;">Financeiro</p>
                <h3 id="card-fin" class="valor-preto">0</h3>
            </div>

            <div class="card-base card-total">
                <p class="label-card">Total Geral</p>
                <h3 id="card-total" class="valor-preto">0</h3>
            </div>
        </div>

        <div class="container-grafico flex flex-col items-center">
            <h4 class="text-2xl font-black text-gray-700 mb-8 uppercase italic">Proporção de Atendimento</h4>
            <div style="position: relative; height:400px; width:400px">
                <canvas id="graficoPizza"></canvas>
            </div>
        </div>
    </main>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
